<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNPA League - 赛程</title>

    <style>
        /* =========================================================
           1. Global
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cnpa-red: #e51422;
            --cnpa-red-dark: #b90e18;

            --black: #080808;
            --black-2: #101010;
            --black-3: #181818;

            --paper: #f1efed;
            --paper-2: #f7f6f4;

            --white: #ffffff;

            --text: #151515;
            --text-secondary: #6f6f6f;
            --text-muted: #9b9b9b;

            --border: #dfddda;
            --border-light: #eceae7;

            --site-width: 1560px;
            --site-padding: clamp(18px, 3vw, 58px);
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "PingFang SC",
                    "Microsoft YaHei",
                    Arial,
                    sans-serif;

            color: var(--text);
            background: #050505;
            overflow-x: hidden;
        }

        button,
        select,
        input {
            font: inherit;
        }

        button {
            border: 0;
        }

        .site-shell {
            width: min(
                    calc(100% - var(--site-padding) * 2),
                    var(--site-width)
            );
            margin: 0 auto;
        }


        /* =========================================================
           2. Header
        ========================================================= */

        .site-header {
            height: 72px;
            background: rgba(6, 6, 7, 0.98);
            border-top: 2px solid var(--cnpa-red);
            border-bottom: 1px solid #292929;

            display: flex;
            align-items: center;

            position: relative;
            z-index: 20;
        }

        .header-inner {
            height: 100%;

            display: flex;
            align-items: stretch;
        }

        .brand {
            width: 180px;

            display: flex;
            align-items: center;
            gap: 10px;

            color: white;
            font-size: 28px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 2px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;

            background:
                    linear-gradient(
                            135deg,
                            transparent 0 23%,
                            var(--cnpa-red) 24% 48%,
                            transparent 49% 55%,
                            var(--cnpa-red) 56% 82%,
                            transparent 83%
                    );

            transform: skewX(-8deg);
        }

        .main-nav {
            display: flex;
            align-items: stretch;
            margin-left: 20px;
        }

        .main-nav a {
            min-width: 104px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #e7e7e7;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;

            position: relative;

            transition:
                    color 0.2s ease,
                    background 0.2s ease;
        }

        .main-nav a:hover {
            color: white;
            background: #111;
        }

        .main-nav a.active {
            color: white;
            background:
                    linear-gradient(
                            180deg,
                            rgba(229, 20, 34, 0.18),
                            rgba(229, 20, 34, 0.03)
                    );
        }

        .main-nav a.active::after {
            content: "";
            position: absolute;
            left: 26px;
            right: 26px;
            bottom: 0;
            height: 3px;
            background: var(--cnpa-red);
        }

        .header-actions {
            margin-left: auto;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-search {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            color: white;
            font-size: 22px;
        }

        .login-btn,
        .register-btn {
            width: 86px;
            height: 42px;

            display: grid;
            place-items: center;

            color: white;
            font-weight: 700;
        }

        .login-btn {
            border: 1px solid #555;
            background: transparent;
        }

        .register-btn {
            background: var(--cnpa-red);
        }


        /* =========================================================
           3. Event secondary header
        ========================================================= */

        .event-nav {
            background:
                    radial-gradient(
                            circle at 80% 0%,
                            rgba(153, 0, 0, 0.15),
                            transparent 40%
                    ),
                    #0c0c0d;

            border-bottom: 1px solid #222;
        }

        .event-nav-inner {
            height: 68px;

            display: flex;
            align-items: stretch;
            gap: 8px;
        }

        .event-nav a {
            min-width: 190px;
            padding: 0 24px;

            display: flex;
            align-items: center;

            text-decoration: none;

            font-size: 17px;
            color: #aaa;
            font-weight: 600;

            position: relative;
        }

        .event-nav a.active {
            color: var(--cnpa-red);
        }

        .event-nav a.active::after {
            content: "";
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 0;
            height: 4px;
            background: var(--cnpa-red);
        }


        /* =========================================================
           4. Main page
        ========================================================= */

        .schedule-page {
            min-height: calc(100vh - 140px);

            background:
                    linear-gradient(
                            rgba(255,255,255,0.95),
                            rgba(244,242,239,0.98)
                    );

            padding: 32px 0 70px;
        }

        .schedule-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            margin-bottom: 26px;
        }

        .schedule-title-row {
            display: flex;
            align-items: baseline;
            gap: 16px;
        }

        .schedule-title {
            font-size: clamp(32px, 3vw, 48px);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .schedule-slash {
            font-size: 25px;
            font-weight: 300;
            color: #777;
        }

        .schedule-en {
            color: var(--cnpa-red);

            font-size: 15px;
            font-style: italic;
            font-weight: 800;

            letter-spacing: 2px;
        }

        .season-select {
            min-width: 260px;
            height: 44px;

            padding: 0 40px 0 16px;

            background: white;
            border: 1px solid var(--border);

            color: #222;
            font-weight: 700;

            cursor: pointer;
            outline: none;
        }


        /* =========================================================
           5. Weekly toolbar
        ========================================================= */

        .calendar-toolbar {
            min-height: 82px;

            background:
                    linear-gradient(
                            90deg,
                            #0b0b0c,
                            #141414 60%,
                            #0d0d0e
                    );

            display: grid;

            grid-template-columns:
                130px
                minmax(0, 1fr)
                auto;

            align-items: center;

            padding: 0 18px;

            color: white;

            border-radius: 4px 4px 0 0;
        }

        .week-control {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .week-number {
            white-space: nowrap;

            font-size: 18px;
            font-weight: 800;
        }

        .arrow-btn {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            background: #161616;
            border: 1px solid #333;

            color: white;
            font-size: 24px;

            cursor: pointer;

            transition:
                    border-color 0.2s ease,
                    background 0.2s ease;
        }

        .arrow-btn:hover {
            background: #222;
            border-color: #555;
        }

        .week-days {
            display: grid;

            grid-template-columns:
                90px
                repeat(7, minmax(78px, 1fr));

            height: 100%;
        }

        .day-item {
            min-width: 0;

            padding: 11px 8px 8px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            color: #d1d1d1;
            cursor: pointer;

            position: relative;

            transition:
                    color 0.2s ease,
                    background 0.2s ease;
        }

        .day-item:hover {
            background: rgba(255,255,255,0.04);
        }

        .day-item .weekday {
            font-size: 12px;
            color: #aaa;
        }

        .day-item .date {
            margin-top: 4px;

            font-size: 17px;
            font-weight: 800;
        }

        .day-item .match-count {
            min-height: 15px;
            margin-top: 3px;

            font-size: 10px;
            color: #777;
        }

        .day-item.all .weekday {
            color: var(--cnpa-red);
        }

        .day-item.all .date {
            color: var(--cnpa-red);
            font-size: 14px;
        }

        .day-item.active {
            background:
                    linear-gradient(
                            180deg,
                            var(--cnpa-red),
                            #b70d17
                    );

            color: white;
        }

        .day-item.active .weekday,
        .day-item.active .match-count {
            color: rgba(255,255,255,0.85);
        }

        .day-item.today:not(.active)::after {
            content: "";
            position: absolute;

            bottom: 6px;

            width: 5px;
            height: 5px;

            border-radius: 50%;
            background: var(--cnpa-red);
        }

        .calendar-tools {
            margin-left: 12px;

            display: flex;
            gap: 10px;
        }

        .toolbar-btn {
            min-width: 108px;
            height: 42px;

            padding: 0 15px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            background: #171717;
            border: 1px solid #3b3b3b;

            color: white;
            font-weight: 700;

            cursor: pointer;

            transition:
                    background 0.2s ease,
                    border-color 0.2s ease;
        }

        .toolbar-btn:hover,
        .toolbar-btn.active {
            background: var(--cnpa-red);
            border-color: var(--cnpa-red);
        }


        /* =========================================================
           6. Filter summary
        ========================================================= */

        .filter-summary {
            min-height: 46px;

            display: flex;
            align-items: center;
            gap: 14px;

            padding: 0 24px;

            background: white;
            border:
                    1px solid var(--border-light);

            color: #525252;
            font-size: 13px;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .summary-divider {
            width: 1px;
            height: 18px;
            background: #ddd;
        }


        /* =========================================================
           7. Expanded calendar
        ========================================================= */

        .calendar-panel {
            display: none;

            padding: 24px;

            background: #fff;

            border:
                    1px solid var(--border);
            border-top: none;
        }

        .calendar-panel.show {
            display: block;
        }

        .calendar-months {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 18px;
        }

        .month-card {
            min-height: 325px;

            background: var(--paper-2);

            border: 1px solid var(--border-light);

            padding: 20px;
        }

        .month-title {
            margin-bottom: 18px;

            text-align: center;

            font-size: 17px;
            font-weight: 800;
        }

        .month-weekdays,
        .month-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);

            text-align: center;
        }

        .month-weekdays span {
            padding: 8px 0;

            color: #999;
            font-size: 12px;
        }

        .calendar-date {
            min-height: 40px;

            display: grid;
            place-items: center;

            margin: 2px;

            font-size: 13px;

            cursor: pointer;

            position: relative;
        }

        .calendar-date:hover {
            background: #eee;
        }

        .calendar-date.weekend {
            color: #e64550;
        }

        .calendar-date.has-match::after {
            content: "";

            position: absolute;
            left: 50%;
            bottom: 3px;

            transform: translateX(-50%);

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: var(--cnpa-red);
        }

        .calendar-date.selected {
            background: var(--cnpa-red);
            color: white;
            font-weight: 800;
        }

        .calendar-date.selected::after {
            background: white;
        }

        .calendar-date.empty {
            pointer-events: none;
        }


        /* =========================================================
           8. Team panel
        ========================================================= */

        .team-panel {
            display: none;

            padding: 24px;

            background: #fff;

            border:
                    1px solid var(--border);
            border-top: none;
        }

        .team-panel.show {
            display: block;
        }

        .team-panel-title {
            margin-bottom: 18px;

            display: flex;
            align-items: center;
            gap: 14px;

            font-size: 16px;
            font-weight: 800;
        }

        .team-panel-title::before,
        .team-panel-title::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #e0e0e0;
        }

        .team-grid {
            display: grid;

            grid-template-columns:
                repeat(9, minmax(86px, 1fr));

            gap: 10px;
        }

        .team-filter-item {
            min-height: 100px;

            padding: 11px 6px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 7px;

            background: #fafafa;

            border: 1px solid transparent;

            cursor: pointer;

            position: relative;

            transition:
                    border-color 0.2s ease,
                    background 0.2s ease,
                    transform 0.2s ease;
        }

        .team-filter-item:hover {
            background: #f3f3f3;
            transform: translateY(-1px);
        }

        .team-filter-item.active {
            border-color: var(--cnpa-red);
            background: rgba(229,20,34,0.04);
        }

        .team-filter-item.active::after {
            content: "✓";

            position: absolute;
            top: 6px;
            right: 8px;

            width: 18px;
            height: 18px;

            border-radius: 50%;

            display: grid;
            place-items: center;

            background: var(--cnpa-red);
            color: white;

            font-size: 11px;
            font-weight: 900;
        }

        .team-filter-logo {
            width: 48px;
            height: 48px;

            display: grid;
            place-items: center;

            background: #161616;
            color: white;

            font-size: 13px;
            font-weight: 900;
        }

        .team-filter-item.all .team-filter-logo {
            background: transparent;
            border: 1px solid var(--cnpa-red);

            color: var(--cnpa-red);

            font-size: 20px;
        }

        .team-filter-name {
            max-width: 100%;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            font-size: 12px;
            font-weight: 700;
        }


        /* =========================================================
           9. Match content
        ========================================================= */

        .match-content {
            margin-top: 24px;
        }

        .date-group + .date-group {
            margin-top: 32px;
        }

        .date-group-title {
            min-height: 44px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 16px 0 18px;

            border-left: 4px solid var(--cnpa-red);

            background:
                    linear-gradient(
                            90deg,
                            #faf9f7,
                            transparent
                    );
        }

        .date-group-title strong {
            font-size: 19px;
            font-weight: 900;
        }

        .date-group-title span {
            color: var(--text-secondary);
            font-size: 13px;
        }


        /* =========================================================
           10. Match table
        ========================================================= */

        .schedule-table {
            margin-top: 8px;

            border:
                    1px solid var(--border-light);

            background: white;
        }

        .schedule-columns {
            --schedule-columns:
                    92px
                    minmax(175px, 1fr)
                    130px
                    minmax(175px, 1fr)
                    145px
                    78px
                    100px;
        }

        .schedule-header,
        .match-main-row {
            display: grid;
            grid-template-columns:
                var(--schedule-columns);

            align-items: center;
        }

        .schedule-header {
            min-height: 42px;

            background: #111;

            color: #eee;

            font-size: 12px;
            font-weight: 700;
        }

        .schedule-header > div {
            padding: 0 14px;
        }

        .schedule-header .center {
            text-align: center;
        }

        .match-item {
            border-bottom:
                    1px solid var(--border-light);

            transition: background 0.18s ease;
        }

        .match-item:last-child {
            border-bottom: 0;
        }

        .match-item:hover {
            background: #fcfbfa;
        }

        .match-main-row {
            min-height: 68px;
        }

        .match-main-row > div {
            min-width: 0;

            padding: 8px 14px;
        }


        /* =========================================================
           11. Time
        ========================================================= */

        .match-time {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .match-time strong {
            font-size: 17px;
            line-height: 1;
            font-weight: 900;
        }

        .match-no {
            margin-top: 5px;

            color: #aaa;
            font-size: 10px;
        }


        /* =========================================================
           12. Team
        ========================================================= */

        .team-cell {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .team-logo {
            width: 46px;
            height: 46px;

            flex: 0 0 46px;

            display: grid;
            place-items: center;

            background:
                    linear-gradient(
                            145deg,
                            #141414,
                            #222
                    );

            border: 1px solid #292929;

            color: white;

            font-size: 12px;
            font-weight: 900;
        }

        .team-name-group {
            min-width: 0;

            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .team-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 15px;
            font-weight: 800;
        }

        .team-code {
            color: #999;
            font-size: 11px;
        }


        /* =========================================================
           13. Score
        ========================================================= */

        .score-cell {
            text-align: center;
        }

        .score {
            font-size: clamp(21px, 1.8vw, 28px);
            font-weight: 900;
            letter-spacing: 1px;
        }

        .score .loser {
            color: #777;
        }

        .score-vs {
            font-size: 23px;
            font-weight: 900;

            color: #666;
        }


        /* =========================================================
           14. Stage / BO / Status
        ========================================================= */

        .stage-cell {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stage-name {
            font-size: 13px;
            font-weight: 800;
        }

        .round-name {
            color: #777;
            font-size: 11px;
        }

        .bo-cell,
        .status-cell {
            text-align: center;
        }

        .bo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 46px;
            height: 27px;

            padding: 0 8px;

            background: #f3f3f3;
            border: 1px solid #ddd;

            color: #333;

            font-size: 11px;
            font-weight: 900;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 58px;
            min-height: 26px;

            padding: 3px 8px;

            font-size: 11px;
            font-weight: 800;
        }

        .status-badge.finished {
            background: #efefef;
            color: #555;
        }

        .status-badge.live {
            background: rgba(229,20,34,0.1);
            color: var(--cnpa-red);
        }

        .status-badge.scheduled {
            background: #f4f4f4;
            color: #999;
        }

        .status-badge.forfeit {
            background: #fff0e8;
            color: #d95e1f;
        }


        /* =========================================================
           15. Actions
        ========================================================= */

        .match-actions-row {
            min-height: 42px;

            padding: 6px 14px;

            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;

            border-top:
                    1px solid #f0efed;

            background:
                    linear-gradient(
                            90deg,
                            transparent 60%,
                            #faf9f8
                    );
        }

        .match-action-btn {
            min-width: 118px;
            height: 31px;

            padding: 0 14px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            background: white;
            border: 1px solid #c9c9c9;

            color: #333;

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;

            transition:
                    border-color 0.18s ease,
                    color 0.18s ease,
                    background 0.18s ease;
        }

        .match-action-btn:not(:disabled):hover {
            border-color: var(--cnpa-red);
            color: var(--cnpa-red);
        }

        .match-action-btn.primary {
            border-color: rgba(229,20,34,0.55);
            color: var(--cnpa-red);
        }

        .match-action-btn:disabled {
            background: #f4f4f4;
            border-color: #ddd;

            color: #aaa;
            cursor: not-allowed;
        }

        .waiting-btn {
            min-width: 250px;
        }


        /* =========================================================
           16. Empty
        ========================================================= */

        .schedule-empty {
            display: none;

            min-height: 180px;

            align-items: center;
            justify-content: center;

            flex-direction: column;
            gap: 8px;

            background: white;
            border: 1px solid var(--border-light);

            color: #888;
        }

        .schedule-empty.show {
            display: flex;
        }

        .schedule-empty strong {
            color: #333;
            font-size: 18px;
        }


        /* =========================================================
           17. Responsive
        ========================================================= */

        @media (max-width: 1200px) {

            .calendar-toolbar {
                grid-template-columns:
                    110px
                    minmax(0, 1fr);
            }

            .calendar-tools {
                grid-column: 1 / -1;

                margin: 0;
                padding: 8px 0 12px;

                justify-content: flex-end;
            }

            .week-days {
                grid-template-columns:
                    72px
                    repeat(7, minmax(60px, 1fr));
            }

            .team-grid {
                grid-template-columns:
                    repeat(6, minmax(90px, 1fr));
            }

            .schedule-columns {
                --schedule-columns:
                        82px
                        minmax(145px, 1fr)
                        105px
                        minmax(145px, 1fr)
                        130px
                        65px
                        88px;
            }
        }


        @media (max-width: 900px) {

            .main-nav a {
                min-width: 78px;
            }

            .event-nav a {
                min-width: 150px;
            }

            .schedule-heading {
                align-items: flex-start;
                gap: 18px;
            }

            .schedule-title-row {
                flex-wrap: wrap;
            }

            .season-select {
                min-width: 220px;
            }

            .calendar-toolbar {

        const weekdayMap = [
            "星期日",
            "星期一",
            "星期二",
            "星期三",
            "星期四",
            "星期五",
            "星期六"
        ];

        return `${date.getMonth() + 1}月${date.getDate()}日 · ${weekdayMap[date.getDay()]}`;
    };


    const getFilteredMatches = () => {

        return matches.filter(match => {

            const dateMatched =
                !selectedDate ||
                match.date === selectedDate;

            const teamMatched =
                !selectedTeamId ||
                match.homeTeamId === selectedTeamId ||
                match.awayTeamId === selectedTeamId;

            return dateMatched && teamMatched;
        });
    };


    const groupByDate = (items) => {

        return items.reduce((map, item) => {

            if (!map[item.date]) {
                map[item.date] = [];
            }

            map[item.date].push(item);

            return map;

        }, {});

            closeTeamPanel();

        teams.forEach(team => {

            element.className =

                (
                    selectedTeamId === team.id
                        ? " active"
                        : ""

                    ${team.code.slice(0, 2)}

                <span class="team-filter-name">
                    ${team.name}

                renderMatches();
                updateSummary();

                closeTeamPanel();

            grid.appendChild(element);

    /* =========================================================
       Match row
    ========================================================= */

    function buildMatchItem(match) {

        const away = getTeam(match.awayTeamId);
        const home = getTeam(match.homeTeamId);

        const item = document.createElement("article");

        item.className = "match-item";


        let scoreHtml = "";

        if (
            match.status === "FINISHED" ||
            match.status === "FORFEITED"
        ) {

            const awayWinner =
                match.awayScore > match.homeScore;

            const homeWinner =
                match.homeScore > match.awayScore;

            scoreHtml = `
                <div class="score">
                    <span class="${awayWinner ? "" : "loser"}">
                        ${match.awayScore}
                    </span>
                    :
                    <span class="${homeWinner ? "" : "loser"}">
                        ${match.homeScore}
                    </span>
                </div>
            `;

        } else {

            scoreHtml = `
                <div class="score-vs">
                    VS
                </div>
            `;
        }


        const statusMap = {
            FINISHED: {
                text: "已结束",
                className: "finished"
            },

            SCHEDULED: {
                text: "未开始",
                className: "scheduled"
            },

            PLAYING: {
                text: "进行中",
                className: "live"
            },

            FORFEITED: {
                text: "弃权结束",
                className: "forfeit"
            }
        };

        const status =
            statusMap[match.status] ||
            statusMap.SCHEDULED;


        item.innerHTML = `

                    <span class="match-no">

                            waiting-btn

        const videoDisabled =

        return `

        `;
    }


    /* =========================================================
       Render matches
    ========================================================= */

    function renderMatches() {

        const content =
            document.getElementById("matchContent");

        const empty =
            document.getElementById("scheduleEmpty");

        content.innerHTML = "";


        const filtered =
            getFilteredMatches()
                .sort((a, b) => {

                    const aDate =
                        `${a.date} ${a.time}`;

                    const bDate =
                        `${b.date} ${b.time}`;

                    return aDate.localeCompare(bDate);
                });


        if (!filtered.length) {

            empty.classList.add("show");
            return;
        }

        empty.classList.remove("show");


        const grouped =
            groupByDate(filtered);


        Object.keys(grouped)
            .sort()
            .forEach(date => {

                const group =
                    document.createElement("section");

                group.className = "date-group";


                const title =
                    document.createElement("div");

                title.className = "date-group-title";

                title.innerHTML = `
                    <strong>
                        ${formatDateTitle(date)}
                    </strong>

                    <span>
                        共 ${grouped[date].length} 场比赛
                    </span>
                `;


                const table =
                    document.createElement("div");

                table.className =
                    "schedule-table schedule-columns";


                table.innerHTML = `
                    <div class="schedule-header">

                        <div>时间</div>

                        <div>客队</div>

                        <div class="center">
                            比分
                        </div>

                        <div>主队</div>

                        <div>赛事阶段</div>

                        <div class="center">
                            BO
                        </div>

                        <div class="center">
                            状态
                        </div>

                    </div>
                `;


                grouped[date].forEach(match => {

                    table.appendChild(
                        buildMatchItem(match)
                    );
                });


                group.appendChild(title);
                group.appendChild(table);

                content.appendChild(group);
            });
    }


    /* =========================================================
       Summary
    ========================================================= */

    function updateSummary() {

        const filtered =
            getFilteredMatches();


        document.getElementById(
            "summaryDate"
        ).textContent =
            selectedDate
                ? formatDateTitle(selectedDate)
                : "全部日期";


        const selectedTeam =
            selectedTeamId
                ? getTeam(selectedTeamId)
                : null;


        document.getElementById(
            "summaryTeam"
        ).textContent =
            selectedTeam
                ? `${selectedTeam.name} · ${selectedTeam.code}`
                : "全部球队";


        document.getElementById(
            "summaryCount"
        ).textContent =
            filtered.length;


        document.getElementById(
            "teamButtonText"
        ).textContent =
            selectedTeam
                ? selectedTeam.name
                : "选择球队";
    }


    /* =========================================================
       Week dates
    ========================================================= */

    document
        .querySelectorAll(".day-item")
        .forEach(item => {

            item.addEventListener(
                "click",
                function () {

                    selectedDate =
                        this.dataset.date || null;

                    document
                        .querySelectorAll(
                            ".day-item"
                        )
                        .forEach(el => {
                            el.classList.remove("active");
                        });

                    this.classList.add("active");


                    renderMatches();
                    updateSummary();
                }
            );
        });


    /* =========================================================
       Calendar toggle
    ========================================================= */

    const calendarToggle =
        document.getElementById(
            "calendarToggle"
        );

    const calendarPanel =
        document.getElementById(
            "calendarPanel"
        );

    const teamToggle =
        document.getElementById(
            "teamToggle"
        );

    const teamPanel =
        document.getElementById(
            "teamPanel"
        );


    calendarToggle.onclick = () => {

        const show =
            !calendarPanel.classList.contains("show");

        teamPanel.classList.remove("show");
        teamToggle.classList.remove("active");

        calendarPanel.classList.toggle(
            "show",
            show
        );

        calendarToggle.classList.toggle(
            "active",
            show
        );
    };


    teamToggle.onclick = () => {

        const show =
            !teamPanel.classList.contains("show");

        calendarPanel.classList.remove("show");
        calendarToggle.classList.remove("active");

        teamPanel.classList.toggle(
            "show",
            show
        );

        teamToggle.classList.toggle(
            "active",
            show
        );
    };


    function closeTeamPanel() {

        teamPanel.classList.remove("show");
        teamToggle.classList.remove("active");
    }


    /* =========================================================
       Month calendar
    ========================================================= */

    function renderMonthCalendars() {

        const matchDates =
            new Set(
                matches.map(match => match.date)
            );


        document
            .querySelectorAll(".month-days")
            .forEach(container => {

                const year =
                    Number(container.dataset.year);

                const month =
                    Number(container.dataset.month);


                container.innerHTML = "";


                const firstDay =
                    new Date(year, month, 1);

                const daysInMonth =
                    new Date(
                        year,
                        month + 1,
                        0
                    ).getDate();


                for (
                    let i = 0;
                    i < firstDay.getDay();
                    i++
                ) {

                    const empty =
                        document.createElement("span");

                    empty.className =
                        "calendar-date empty";

                    container.appendChild(empty);
                }


                for (
                    let day = 1;
                    day <= daysInMonth;
                    day++
                ) {

                    const date =
                        new Date(
                            year,
                            month,
                            day
                        );

                    const yyyy =
                        date.getFullYear();

                    const mm =
                        String(
                            date.getMonth() + 1
                        ).padStart(2, "0");

                    const dd =
                        String(day)
                            .padStart(2, "0");

                    const dateString =
                        `${yyyy}-${mm}-${dd}`;


                    const item =
                        document.createElement("button");

                    item.className =
                        "calendar-date";


                    if (
                        date.getDay() === 0 ||
                        date.getDay() === 6
                    ) {

                        item.classList.add(
                            "weekend"
                        );
                    }


                    if (
                        matchDates.has(dateString)
                    ) {

                        item.classList.add(
                            "has-match"
                        );
                    }


                    if (
                        selectedDate === dateString
                    ) {

                        item.classList.add(
                            "selected"
                        );
                    }


                    item.textContent =
                        day;


                    item.onclick = () => {

                        selectedDate =
                            dateString;


                        document
                            .querySelectorAll(
                                ".day-item"
                            )
                            .forEach(el => {
                                el.classList.remove(
                                    "active"
                                );
                            });


                        renderMonthCalendars();
                        renderMatches();
                        updateSummary();


                        calendarPanel.classList.remove(
                            "show"
                        );

                        calendarToggle.classList.remove(
                            "active"
                        );
                    };


                    container.appendChild(
                        item
                    );
                }
            });
    }


    /* =========================================================
       Init
    ========================================================= */

    renderTeamGrid();
    renderMonthCalendars();
    renderMatches();
    updateSummary();
</script>

</body>
</html>
