# 生产 / 公网部署配置
# 启动示例：java -jar xxx.jar --spring.profiles.active=prod
# 或环境变量：SPRING_PROFILES_ACTIVE=prod
#
# Formal mail path: QQ SMTP + Redis verification. Do not enable mail bypass.

server:
  port: 8881
  # Same-host Nginx only. Override CNPA_WEB_BIND if backend is on another NIC.
  address: ${CNPA_WEB_BIND:127.0.0.1}

logging:
  level:
    com.zhs: info
    org.springframework: warn

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/basketball?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: zlzcnpa2026@@qaq
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  data:
    redis:
      # Shared with basketball-admin. Public cache keys are basket:public:*.
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
  mail:
    # QQ SMTP. password is the SMTP authorization code, not the QQ login password.
    # 仓库里没有授权码，留空只为避免启动时解析占位符失败；发信前填上 username 和 password。
    host: smtp.qq.com
    port: 465
    username: ""
    password: ""
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

account:
  file:
    storage-type: cos
    local-root: ${CNPA_FILE_ROOT:/home/jsj/uploadPath}
    public-base-url: ${CNPA_FILE_PUBLIC_BASE_URL:}
  crypto:
    aes-key: ${CNPA_FIELD_AES_KEY:}

# 腾讯云 COS（密钥稍后填写；未配置时不影响本地 /common/upload）
tencent:
  cos:
    secret-id: AKIDhJcr8GD1dFqLixFVehZHrGVYQtATvTr4
    secret-key: 4xgPytgIh5LZbSXQ9ey61iFZgZUO7iBw
    region: ap-shanghai
    bucket: basketball-1453992653
    # 默认访问域名（不含协议）；后续可换成自定义域名
    domain: basketball-1453992653.cos.ap-shanghai.myqcloud.com
    https: true
    # 对象键前缀，例如 basketball/upload/yyyy/MM/dd/xxx.png
    key-prefix: basketball

member:
  auth:
    dev-mail-bypass: ${CNPA_MAIL_DEV_BYPASS:false}
  init:
    enabled: false
  mail:
    from: ""
    from-name: CNPA

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# springfox is still on the classpath; disable auto-config in prod.
# UI/docs paths are also blocked by ProductionDocsInterceptor (404).
springfox:
  documentation:
    enabled: false

web:
  cors:
    allowed-origins: ${CNPA_CORS_ALLOWED_ORIGINS:}
    allow-credentials: false
  client-ip:
    trusted-proxies: ${CNPA_TRUSTED_PROXIES:}
  rate-limit:
    enabled: true
    public-normal-limit: ${CNPA_RATE_PUBLIC_NORMAL:180}
    public-high-cost-limit: ${CNPA_RATE_PUBLIC_HIGH_COST:60}
    user-write-limit: ${CNPA_RATE_USER_WRITE:30}
    auth-limit: ${CNPA_RATE_AUTH:40}
    window-seconds: 60
