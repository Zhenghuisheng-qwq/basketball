# 生产 / 公网部署配置
# 启动示例：java -jar xxx.jar --spring.profiles.active=prod
# 或环境变量：SPRING_PROFILES_ACTIVE=prod
#
# 注意：当前公网服务器可能仍处于「内部测试 / 老板验收」阶段，不等于正式开放真实用户。
# 邮箱验证码以环境变量 CNPA_MAIL_DEV_BYPASS 为准（见 member.auth.dev-mail-bypass）。
# 正式真实用户开放前必须：CNPA_MAIL_DEV_BYPASS=false + 真实邮箱验证码 Smoke。

server:
  port: 8881

logging:
  level:
    com.zhs: info
    org.springframework: warn

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://111.229.241.29:3306/basketball?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: zlzcnpa@@qaq
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  data:
    redis:
      host: 106.55.61.223
      port: 6379
      password:
      database: 0
  mail:
    host: ${CNPA_MAIL_HOST:}
    port: ${CNPA_MAIL_PORT:465}
    username: ${CNPA_MAIL_USERNAME:}
    password: ${CNPA_MAIL_AUTH_CODE:}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

account:
  file:
    storage-type: cos
    local-root: ${CNPA_FILE_ROOT:/home/jsj/uploadPath}
    public-base-url: ${CNPA_FILE_PUBLIC_BASE_URL:}
  crypto:
    aes-key: ${CNPA_FIELD_AES_KEY:}

# 腾讯云 COS（密钥稍后填写；未配置时不影响本地 /common/upload）
tencent:
  cos:
    secret-id: AKIDhJcr8GD1dFqLixFVehZHrGVYQtATvTr4
    secret-key: 4xgPytgIh5LZbSXQ9ey61iFZgZUO7iBw
    region: ap-shanghai
    bucket: basketball-1453992653
    # 默认访问域名（不含协议）；后续可换成自定义域名
    domain: basketball-1453992653.cos.ap-shanghai.myqcloud.com
    https: true
    # 对象键前缀，例如 basketball/upload/yyyy/MM/dd/xxx.png
    key-prefix: basketball

member:
  auth:
    # 环境变量 CNPA_MAIL_DEV_BYPASS 优先；勿因 profile=prod 写死导致验收环境无法开启 bypass。
    # 当前公网测试/老板验收：部署时设 CNPA_MAIL_DEV_BYPASS=true
    # 正式真实用户开放前：必须 CNPA_MAIL_DEV_BYPASS=false，并用 QQ/163/Outlook 至少一个真实邮箱完成注册验证
    # 未设置环境变量时 prod 默认 false（安全默认）
    dev-mail-bypass: ${CNPA_MAIL_DEV_BYPASS:false}
  init:
    enabled: false
  mail:
    from: ${CNPA_MAIL_FROM:${CNPA_MAIL_USERNAME:}}
    from-name: ${CNPA_MAIL_FROM_NAME:CNPA赛事平台}
