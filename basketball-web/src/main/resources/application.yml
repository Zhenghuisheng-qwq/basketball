    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 账户文件与字段加密
account:
  file:
    # local=本地磁盘；cos=腾讯云 COS（图片统一走 COS）
    storage-type: cos
    local-root: ./upload
    public-base-url: ""
    max-image-size: 5242880
  crypto:
    aes-key: ""

# 腾讯云 COS（密钥稍后填写；未配置时不影响本地上传）
