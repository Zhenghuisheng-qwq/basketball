server:
  port: 8881
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

spring:
  application:
    name: basketball-web
  config:
    import: optional:file:./config/application-local.yml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Required: CNPA_DATASOURCE_URL, CNPA_DATASOURCE_USERNAME, CNPA_DATASOURCE_PASSWORD.
    # Required Redis host: CNPA_REDIS_HOST. Do not commit values.
    url: ${CNPA_DATASOURCE_URL}
    username: ${CNPA_DATASOURCE_USERNAME}
    password: ${CNPA_DATASOURCE_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  data:
    redis:
      host: ${CNPA_REDIS_HOST}
      port: ${CNPA_REDIS_PORT:6379}
      password: ${CNPA_REDIS_PASSWORD:}
      database: 0
      timeout: 400ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  mail:
    # QQ SMTP. password is the SMTP authorization code, not the QQ login password.
    host: ${CNPA_MAIL_HOST:smtp.qq.com}
    port: ${CNPA_MAIL_PORT:465}
    username: ${CNPA_MAIL_USERNAME:}
    password: ${CNPA_MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ruoyi.miniapp.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 账户文件与字段加密
account:
  file:
    # local=本地磁盘；cos=腾讯云 COS（图片统一走 COS）
    storage-type: cos
    local-root: ${CNPA_FILE_ROOT:./upload}
    public-base-url: ${CNPA_FILE_PUBLIC_BASE_URL:}
    max-image-size: 5242880
  crypto:
    aes-key: ${CNPA_FIELD_AES_KEY:}

# 腾讯云 COS（密钥稍后填写；未配置时不影响本地上传）
tencent:
  cos:
    secret-id: ${CNPA_COS_SECRET_ID:}
    secret-key: ${CNPA_COS_SECRET_KEY:}
    region: ap-shanghai
    bucket: basketball-1453992653
    # 默认访问域名（不含协议）；后续可换成自定义域名
    domain: basketball-1453992653.cos.ap-shanghai.myqcloud.com
    https: true
    # 对象键前缀，例如 basketball/public/yyyy/MM/dd/xxx.png
    key-prefix: basketball

# 官网会员认证
member:
  auth:
    token-expire-days: 30
    code-expire-seconds: 300
    code-resend-seconds: 60
    code-daily-limit: 20
    code-ip-hourly-limit: 30
    code-max-fail-times: 5
    login-fail-max-times: 5
    login-lock-minutes: 15
    # Default closed. Local auto tests may set CNPA_MAIL_DEV_BYPASS=true to skip SMTP only.
    # Formal path must keep false: random code + QQ SMTP + Redis verify. No fixed 123456.
    dev-mail-bypass: ${CNPA_MAIL_DEV_BYPASS:false}
  mail:
    from: ${CNPA_MAIL_USERNAME:}
    from-name: CNPA
  init:
    enabled: false
    batch-size: 30
    password: ${CNPA_MEMBER_INIT_PASSWORD:}
    email-domain: qq.com
    email-start: 111111
    data-file-path: 测试/测试数据.txt
    cert-screenshot-resource: classpath:player/5.png
    # 完整编排（认证审核/授队长/建队/入队）见：
    # node scripts/seed-cnpa-full-pipeline.mjs

# 球队业务配置
team:
  invitation:
    expire-days: 7
  default-max-member-count: 8

# C 端 Web 防护（dev 默认；prod 由 application-prod.yml / 环境变量覆盖）
web:
  cors:
    allowed-origins: ${CNPA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
    allow-credentials: false
  client-ip:
    trusted-proxies: ${CNPA_TRUSTED_PROXIES:}
  rate-limit:
    enabled: true
    public-normal-limit: ${CNPA_RATE_PUBLIC_NORMAL:180}
    public-high-cost-limit: ${CNPA_RATE_PUBLIC_HIGH_COST:60}
    user-write-limit: ${CNPA_RATE_USER_WRITE:30}
    auth-limit: ${CNPA_RATE_AUTH:40}
    window-seconds: 60
