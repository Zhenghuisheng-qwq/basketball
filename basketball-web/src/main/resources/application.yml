server:
  port: 8881
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

spring:
  application:
    name: basketball-web

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.31.48:3306/basketball?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  data:
    redis:
      host: 192.168.31.48
      port: 6379
      password:
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  mail:
    host: ${CNPA_MAIL_HOST:smtp.qq.com}
    port: ${CNPA_MAIL_PORT:465}
    username: ${CNPA_MAIL_USERNAME:}
    password: ${CNPA_MAIL_AUTH_CODE:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ruoyi.miniapp.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 账户文件与字段加密
account:
  file:
    # local=本地磁盘；cos=腾讯云 COS（图片统一走 COS）
    storage-type: cos
    local-root: ${CNPA_FILE_ROOT:./upload}
    public-base-url: ${CNPA_FILE_PUBLIC_BASE_URL:}
    max-image-size: 5242880
  crypto:
    # 本地开发写死 16 字节密钥；生产请设置 CNPA_FIELD_AES_KEY
    aes-key: ${CNPA_FIELD_AES_KEY:CNPA2026DEVKEY01}

# 腾讯云 COS（密钥稍后填写；未配置时不影响本地上传）
tencent:
  cos:
    secret-id: AKIDhJcr8GD1dFqLixFVehZHrGVYQtATvTr4
    secret-key: 4xgPytgIh5LZbSXQ9ey61iFZgZUO7iBw
    region: ap-shanghai
    bucket: basketball-1453992653
    # 默认访问域名（不含协议）；后续可换成自定义域名
    domain: basketball-1453992653.cos.ap-shanghai.myqcloud.com
    https: true
    # 对象键前缀，例如 basketball/public/yyyy/MM/dd/xxx.png
    key-prefix: basketball

# 官网会员认证
member:
  auth:
    token-expire-days: 30
    code-expire-seconds: 300
    code-resend-seconds: 60
    code-daily-limit: 20
    code-ip-hourly-limit: 30
    code-max-fail-times: 5
    login-fail-max-times: 5
    login-lock-minutes: 15
    # 邮箱验证码 Dev Bypass（仅绕过 SMTP 投递/验证码比对，不绕过注册业务）
    # 本地默认 true；公网测试/老板验收也可通过环境变量设 true
    # 正式真实用户开放前必须：CNPA_MAIL_DEV_BYPASS=false + 真实邮箱验证码 Smoke
    # 环境变量优先于 profile；勿在 Java 写死
    dev-mail-bypass: ${CNPA_MAIL_DEV_BYPASS:true}
  mail:
    from: ${CNPA_MAIL_FROM:${CNPA_MAIL_USERNAME:}}
    from-name: ${CNPA_MAIL_FROM_NAME:CNPA赛事平台}
  init:
    enabled: true
    batch-size: 30
    password: 111111aa
    email-domain: qq.com
    email-start: 111111
    data-file-path: 测试/测试数据.txt
    cert-screenshot-resource: classpath:player/5.png
    # 完整编排（认证审核/授队长/建队/入队）见：
    # node scripts/seed-cnpa-full-pipeline.mjs

# 球队业务配置
team:
  invitation:
    expire-days: 7
  default-max-member-count: 8
